config_version = 16

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.79999998211860657
    capsule_radius = 0
    center = [ "bar_3" ]
    color = "#A6ADC8"
    concave_edge_corners = false
    end = [ "tray", "printer", "notifications", "github", "temp", "ram", "network", "volume", "battery", "clock" ]
    font_family = "Ubuntu Nerd Font"
    icon_color = "#A6ADC8"
    margin_ends = 0
    padding = 10
    position = "bottom"
    radius = 0
    radius_bottom_left = 0
    radius_bottom_right = 0
    show_on_workspace_switch = false
    start = [ "launcher", "workspaces", "taskbar" ]
    widget_spacing = 12

        [bar.default.dead_zone.actions]
        right = "none"
        scroll_down = "workspace-switch next"
        scroll_up = "workspace-switch prev"

[battery]
warning_threshold = 40

[control_center]
hidden_tabs = [ "monitor", "screen-time" ]
sidebar = "full"
sidebar_section = "none"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "andrewdems/printers:toggle"

    [[control_center.shortcuts]]
    type = "noctalia/screen_recorder:toggle"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
address = "Cotabato City, Philippines"

[lockscreen]
