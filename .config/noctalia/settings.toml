config_version = 16

[bar.default]
capsule_radius = 2
center = []
color = "#A6ADC8"
concave_edge_corners = false
end = [ "tray", "printer", "notifications", "github", "temp", "ram", "battery", "network", "volume", "clock" ]
font_family = "Ubuntu Nerd Font"
icon_color = "#A6ADC8"
margin_ends = 0
padding = 10
position = "bottom"
radius = 0
radius_bottom_left = 0
radius_bottom_right = 0
scale = 1.0500000081956387
show_on_workspace_switch = false
start = [ "launcher", "workspaces", "taskbar" ]
thickness = 36
widget_spacing = 12

    [bar.default.dead_zone.actions]
    right = "none"
    scroll_down = "workspace-switch next"
    scroll_up = "workspace-switch prev"

[battery]
warning_threshold = 40

[control_center]
hidden_tabs = [ "monitor", "screen-time" ]
sidebar = "full"
sidebar_section = "none"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "andrewdems/printers:toggle"

    [[control_center.shortcuts]]
    type = "noctalia/screen_recorder:toggle"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
address = "Cotabato City, Philippines"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 959.9998779296875
    cy = 881.4998779296875
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
temperature_day = 10000
temperature_night = 5000

[notification]
border = false
offset_x = 8
position = "bottom_right"

[osd]
border = false
position = "bottom_center"

[plugin_settings."andrewdems/printers"]
panel_placement = "floating"
panel_position = "bottom_right"

[plugin_settings."h-jangra/keyviz"]
font_size = "small"
overlay_layer = "overlay"
overlay_position = "bottom_right"

[plugin_settings."noctalia/screen_recorder"]
audio_source = "default_output"
directory = "~/Videos/sr"
video_source = "region"

[plugin_settings."shangshui0302/github-kanban"]
kanban_placement = "floating"
kanban_position = "bottom_right"

[plugins]
enabled = [ "shangshui0302/github-kanban", "andrewdems/printers", "noctalia/screen_recorder" ]

[shell]
button_borders = false
card_borders = false
clipboard_history_max_entries = 500
corner_radius_scale = 0.40000000596046448
font_family = "Ubuntu Nerd Font"
input_borders = false
popup_borders = false
time_format = "{:%-I:%M %p}"

    [shell.animation]
    speed = 1.5000000223517418

    [shell.launcher]
    categories = false
    category_icons_only = true
    compact = true
    fetch_exchange_rates = false
    layout = "simple"
    show_app_origin_indicator = false

        [shell.launcher.providers.emoji]
        global = false
        prefix = "e"

        [shell.launcher.providers.wallpaper]
        prefix = "w"

    [shell.panel]
    borders = false
    control_center_placement = "floating"
    control_center_position = "bottom_right"
    launcher_position = "bottom_left"
    open_near_click_control_center = true
    open_near_click_launcher = true
    session_placement = "floating"
    session_position = "bottom_center"
    wallpaper_placement = "floating"
    wallpaper_position = "bottom_right"

    [shell.screenshot]
    directory = "/home/ebadshelby/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [shell.window_switcher]
    show_all_outputs = false

[theme]
builtin = "Ayu"
custom_palette = "CatppuccinMochaBlue"
mode = "dark"
source = "custom"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper]
directory = "/home/ebadshelby/Pictures/wallpapers"
transition = [ "disc" ]
transition_on_startup = true

    [wallpaper.automation]
    recursive = false

    [wallpaper.default]
    path = "/home/ebadshelby/Pictures/wallpapers/bloom (Copy).png"

    [wallpaper.last]
    path = "/home/ebadshelby/Pictures/wallpapers/bloom (Copy).png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/ebadshelby/Pictures/wallpapers/bloom.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/ebadshelby/Pictures/wallpapers/bloom (Copy).png"

[widget.battery]
show_label = false

[widget.clock]
color = "#A6ADC8"
format = "|  {:%d %a} · {:%-I:%M %p}"

    [widget.clock.actions]
    left = "panel-toggle control-center home"
    scroll_down = "brightness-down"
    scroll_up = "brightness-up"

[widget.github]
type = "shangshui0302/github-kanban:github"

[widget.launcher]
custom_image = "/home/ebadshelby/dotfiles/Pictures/logos/windows11.svg"
scale = 1.1000000000000001

[widget.network]
show_label = false

[widget.printer]
type = "andrewdems/printers:printer"

[widget.ram]
show_label = false
show_value = false
stat = "ram_pct"

[widget.taskbar]
icon_scale = 1.2000000000000002
inactive_opacity = 0.80000000000000004
only_active_workspace = true
show_active_indicator = false
window_title_max_width = 32

[widget.temp]
show_label = false
show_value = false

[widget.volume]
show_label = false

[widget.workspaces]
active_pill_size = 1.5
empty_color = "surface"
focused_color = "outline_variant"
occupied_color = "surface_container"