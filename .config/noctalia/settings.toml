[nightlight]
temperature_day = 10000
temperature_night = 5000

[notification]
background_opacity = 0.79999998211860657
border = false
offset_x = 8
position = "bottom_center"

[osd]
background_opacity = 0.79999998211860657
border = false
position = "bottom_center"

[plugin_settings."ahmedhossamdev/sticky-notes"]
default_color = "blue"

[plugin_settings."andrewdems/printers"]
panel_placement = "floating"

[plugin_settings."h-jangra/keyviz"]
font_size = "small"
overlay_layer = "overlay"
overlay_position = "bottom_right"

[plugin_settings."nightwatch75/todo"]
panel_placement = "floating"
sound_on_complete = true

[plugin_settings."noctalia/screen_recorder"]
audio_source = "default_output"
directory = "~/Videos/sr"
video_source = "portal"

[plugin_settings."noctalia/timer"]
panel_placement = "floating"

[plugin_settings."shangshui0302/github-kanban"]
kanban_placement = "floating"

[plugin_settings."ycf/mawaqit"]
city = "Cotabato"
country = "Philippines"
tune = true
tuneAsr = 2
tuneDhuhr = 16
tuneFajr = 1
tuneIsha = 2
tuneMaghrib = 2
twelveHourFormat = true

[plugins]
enabled = [ "shangshui0302/github-kanban", "andrewdems/printers", "noctalia/screen_recorder", "ycf/mawaqit" ]

[shell]
button_borders = false
card_borders = false
clipboard_history_max_entries = 500
corner_radius_scale = 0.0
font_family = "Ubuntu Nerd Font"
input_borders = false
popup_borders = false
time_format = "{:%-I:%M %p}"

    [shell.animation]
    speed = 2.0000000298023224

    [shell.launcher]
    categories = false
    category_icons_only = true
    compact = true
    fetch_exchange_rates = false
    layout = "simple"
    show_app_origin_indicator = false
    sort_by_usage = false

        [shell.launcher.providers.emoji]
        global = false
        prefix = "e"

        [shell.launcher.providers.wallpaper]
        prefix = "w"

    [shell.panel]
    borders = false
    control_center_placement = "floating"
    control_center_position = "bottom_right"
    open_near_click_control_center = true
    open_near_click_launcher = true
    session_placement = "floating"
    session_position = "bottom_center"
    transparency_mode = "soft"
    wallpaper_placement = "floating"
    wallpaper_position = "bottom_right"

    [shell.screenshot]
    directory = "/home/ebadshelby/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [shell.shadow]
    alpha = 0.24999999441206455

    [shell.window_switcher]
    show_all_outputs = false

[theme]
builtin = "Ayu"
custom_palette = "CatppuccinMochaBlue"
mode = "dark"
source = "custom"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper]
directory = "/home/ebadshelby/Pictures/wallpapers"
transition = [ "disc" ]
transition_on_startup = true

    [wallpaper.automation]
    recursive = false

    [wallpaper.default]
    path = "/home/ebadshelby/Pictures/wallpapers/wallhaven-vpz9g8.jpg"

    [wallpaper.last]
    path = "/home/ebadshelby/Pictures/wallpapers/wallhaven-vpz9g8.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/ebadshelby/Pictures/wallpapers/bloom.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/ebadshelby/Pictures/wallpapers/wallhaven-vpz9g8.jpg"

[widget.audio_visualizer]
mirrored = false

[widget.bar_3]
dynamicIcon = true
type = "ycf/mawaqit:bar"

[widget.battery]
display_mode = "graphic"
scale = 0.69999999999999996

[widget.clock]
format = "|  {:%d %a} · {:%-I:%M %p}"

    [widget.clock.actions]
    left = "panel-toggle control-center home"
    scroll_down = "brightness-down"
    scroll_up = "brightness-up"

[widget.github]
type = "shangshui0302/github-kanban:github"

[widget.launcher]
